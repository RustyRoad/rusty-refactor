[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-employee"
version = "0.2.0"
description = "A2A-native CodeTether office with LiveKit voice presence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "livekit>=1.0",
  "livekit-api>=1.0",
  "numpy>=2.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
  "zeroconf>=0.140",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.11"]

[project.scripts]
remote-employee = "apps.remote_employee.run:main"
remote-employee-presence = "apps.remote_employee.presence_manager:main"
remote-employee-tether = "apps.remote_employee.tether_worker:main"

[tool.setuptools.package-data]
"apps.remote_employee" = [
  "harness/*.tether",
  "harness/manager/*.tether",
  "harness/worker/*.tether",
]

[tool.setuptools.packages.find]
include = ["apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]

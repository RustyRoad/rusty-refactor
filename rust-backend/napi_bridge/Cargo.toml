[package]
name = "napi_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
codetether = ["dep:codetether-agent"]

[dependencies]
napi = { version = "2.14", features = ["full", "async"] }
napi-derive = "2.14"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
codetether-agent = { path = "../../../programming/codetether-agent", optional = true }
serde_json = "1.0.149"

[build-dependencies]
napi-build = "2.1"
